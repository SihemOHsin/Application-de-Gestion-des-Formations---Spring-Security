
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="menu"
     class="navbar navbar-expand-xl navbar-dark custom-navbar"
     style="background: linear-gradient(120deg, #164eaa, #2563eb, #38a3d1);"
     data-bs-theme="dark">

    <div class="container-fluid px-4">

        <!-- Logo ISET Sfax + Nom application -->
        <a class="navbar-brand d-flex align-items-center gap-2"
           th:href="@{/}">

<img th:src="@{/images/logo-iset-sfax.png}"
     alt="Logo ISET Sfax"
     class="iset-logo"
     style="width: 42px; height: 42px; object-fit: contain;
            background: white; border-radius: 8px; padding: 3px;">

            <span class="fw-bold">
                Gestion Formations
            </span>

        </a>

        <!-- Bouton menu mobile -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <!-- Liens centres -->
            <div class="navbar-nav mx-auto align-items-xl-center">

                <a class="nav-link" th:href="@{/}">
                    Accueil
                </a>

                <a class="nav-link"
                   th:href="@{/formations/recherche}">
                    Rechercher une formation
                </a>

                <a class="nav-link"
                   th:href="@{/apprenants}">
                    Gestion des apprenants
                </a>

                <a class="nav-link"
                   th:href="@{/themes}">
                    Gestion des thèmes
                </a>

                <a class="nav-link"
                   th:href="@{/sessions}">
                    Gestion des sessions
                </a>

                <a class="nav-link"
                   th:href="@{/inscriptions}">
                    Inscriptions
                </a>

                <!-- ADMIN uniquement -->
                <a class="nav-link"
                   sec:authorize="hasRole('ADMIN')"
                   th:href="@{/utilisateurs}">
                    Gestion des utilisateurs
                </a>

            </div>

            <!-- Utilisateur et deconnexion -->
            <div class="d-flex align-items-xl-center
                        gap-3 mt-3 mt-xl-0 user-section">

                <span class="connected-user"
                      sec:authorize="isAuthenticated()">

                    Connecté :
                    <strong sec:authentication="name">
                        Utilisateur
                    </strong>

                </span>

                <form th:action="@{/logout}"
                      method="post"
                      class="m-0"
                      sec:authorize="isAuthenticated()">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            class="btn btn-outline-light btn-sm
                                   logout-btn">
                        Déconnexion
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

</body>
</html>
