<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/header :: header}"></head>

<body>

<div th:replace="~{common/menu :: menu}"></div>

<div class="container mt-5">

    <h2>Thème de formation</h2>

    <form th:action="@{/themes/save}"
          th:object="${themeFormation}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label class="form-label">
                Thème
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{theme}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Mots-clés
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{motsCles}">

        </div>

        <button class="btn btn-primary">
            Enregistrer
        </button>

        <a th:href="@{/themes}"
           class="btn btn-secondary">
            Annuler
        </a>

    </form>

</div>

<footer th:replace="~{common/footer :: footer}"></footer>

</body>
</html>
